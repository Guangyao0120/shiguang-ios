name: iOS build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Tests/**'
      - 'UITests/**'
      - 'scripts/**'
      - 'Shiguang.xcodeproj/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        id: clip-cache
        with:
          path: App/CLIPModels
          key: clip-b32-fp16-v1-${{ hashFiles('scripts/prepare_clip.py') }}
      - name: Prepare local CLIP models
        if: steps.clip-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install 'numpy==1.26.4' 'torch==2.2.2' 'torchvision==0.17.2' 'coremltools==8.3' 'git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6'
          python scripts/prepare_clip.py
      - uses: actions/upload-artifact@v4
        with:
          name: Shiguang-Local-CLIP
          path: App/CLIPModels
          if-no-files-found: error
          retention-days: 7
      - name: Locate project
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE" -name Shiguang.xcodeproj -type d -print -quit)
          test -n "$PROJECT"
          echo "SHIGUANG_PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Build for generic simulator
        run: |
          set -o pipefail
          xcodebuild -project "$SHIGUANG_PROJECT" -scheme Shiguang -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ShiguangBuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Run unit tests on available iPhone
        timeout-minutes: 15
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-26" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project "$SHIGUANG_PROJECT" -scheme Shiguang -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/ShiguangBuild" -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 test 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Export review interaction screenshots
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ReviewUI"
          if [ -d "$RUNNER_TEMP/TestResults.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/TestResults.xcresult" --output-path "$RUNNER_TEMP/ReviewUI"
          fi
      - name: Upload review interaction screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shiguang-ReviewUI
          path: ${{ runner.temp }}/ReviewUI
          if-no-files-found: ignore
          retention-days: 7
      - name: Capture light and dark layouts with sample records
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-26" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/ShiguangBuild/Build/Products/Debug-iphonesimulator/Shiguang.app"
          mkdir -p "$RUNNER_TEMP/Appearance"
          for MODE in light dark; do
            xcrun simctl ui "$DEVICE_ID" appearance "$MODE"
            for TAB in 0 1 2 3 4; do
              SIMCTL_CHILD_SHIGUANG_DESIGN_PREVIEW=1 SIMCTL_CHILD_SHIGUANG_PREVIEW_TAB="$TAB" xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.example.Shiguang
              sleep 3
              xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/Appearance/$MODE-$TAB.png"
            done
            for SCREEN in settings detail video search review welcome; do
              SIMCTL_CHILD_SHIGUANG_DESIGN_PREVIEW=1 SIMCTL_CHILD_SHIGUANG_PREVIEW_SCREEN="$SCREEN" xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.example.Shiguang
              sleep 3
              xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/Appearance/$MODE-$SCREEN.png"
            done
          done
          for LANG in en ja ko es ru; do
            SIMCTL_CHILD_SHIGUANG_DESIGN_PREVIEW=1 SIMCTL_CHILD_SHIGUANG_PREVIEW_LANGUAGE="$LANG" SIMCTL_CHILD_SHIGUANG_PREVIEW_SCREEN=settings xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.example.Shiguang
            sleep 2
            xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/Appearance/language-$LANG.png"
          done
      - name: Upload appearance screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Shiguang-Appearance
          path: ${{ runner.temp }}/Appearance
          retention-days: 14
      - name: Package simulator app
        if: github.event_name == 'workflow_dispatch' 
        run: |
          cd "$RUNNER_TEMP/ShiguangBuild/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent Shiguang.app "$RUNNER_TEMP/Shiguang-Simulator.zip"
      - name: Upload simulator app (not installable on iPhone)
        if: github.event_name == 'workflow_dispatch' 
        uses: actions/upload-artifact@v4
        with:
          name: Shiguang-Simulator
          path: ${{ runner.temp }}/Shiguang-Simulator.zip
          retention-days: 7
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shiguang-Build-Reports
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
  iphone:
    needs: simulator
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Shiguang-Local-CLIP
          path: App/CLIPModels
      - name: Archive for real iPhone (sign locally before install)
        run: |
          set -o pipefail
          xcodebuild -project Shiguang.xcodeproj -scheme Shiguang -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Shiguang.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' archive 2>&1 | tee "$RUNNER_TEMP/iphone-build.log"
      - name: Verify and package iPhone IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Shiguang.xcarchive/Products/Applications/Shiguang.app"
          test -d "$APP"
          xcrun lipo -archs "$APP/Shiguang" | tee "$RUNNER_TEMP/iphone-architectures.txt"
          xcrun vtool -show-build "$APP/Shiguang" | tee "$RUNNER_TEMP/iphone-platform.txt"
          grep -q 'arm64' "$RUNNER_TEMP/iphone-architectures.txt"
          grep -Eq 'platform[[:space:]]+IOS$' "$RUNNER_TEMP/iphone-platform.txt"
          mkdir -p "$RUNNER_TEMP/iPhonePackage/Payload"
          ditto "$APP" "$RUNNER_TEMP/iPhonePackage/Payload/Shiguang.app"
          cd "$RUNNER_TEMP/iPhonePackage"
          ditto -c -k --keepParent Payload "$RUNNER_TEMP/Shiguang-iPhone-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/Shiguang-iPhone-unsigned.ipa"
          shasum -a 256 "$RUNNER_TEMP/Shiguang-iPhone-unsigned.ipa" | tee "$RUNNER_TEMP/iphone-sha256.txt"
      - name: Upload iPhone IPA for local signing
        uses: actions/upload-artifact@v4
        with:
          name: Shiguang-iPhone-IPA-unsigned
          path: ${{ runner.temp }}/Shiguang-iPhone-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload iPhone build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shiguang-iPhone-Reports
          path: |
            ${{ runner.temp }}/iphone-build.log
            ${{ runner.temp }}/iphone-architectures.txt
            ${{ runner.temp }}/iphone-platform.txt
            ${{ runner.temp }}/iphone-sha256.txt
            ${{ runner.temp }}/Shiguang.xcarchive/dSYMs
          retention-days: 14
